url: https://github.com/NONEMIN/dsh-sidebar-panels
name: NONEMIN/dsh-sidebar-panels
category: ui
description:
  en: Manage the left global panel list from Settings → General — show or hide entries, drag to reorder with the harness's native drag and drop, and keep each entry in step with the plugin's own sidebar switch.
  zh: 在 设置 → 通用 里集中管理左侧全局面板图标：显示或隐藏、拖动排序，并与各插件自带的侧栏开关双向同步。
